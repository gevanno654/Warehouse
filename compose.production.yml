name: warehouse-receiving-production

# Production Compose — standalone file.
# Do NOT merge with docker-compose.yml via `extends` or multiple -f flags:
# the dev file publishes 5432/3000/5173 and mounts init-test-db.sql.
# This file defines services explicitly so no dev port or mount leaks in.
#
# Usage (Phase 6.2C, requires admin .env.production):
#   docker compose -f compose.production.yml --env-file .env.production config
#   docker compose -f compose.production.yml --env-file .env.production up -d --build
#
# Target topology:
#   Browser https://warehouse.gelabs.net
#   -> aaPanel Nginx (host 80/443)
#   -> web 127.0.0.1:5174 -> container 80 (frontend/nginx.production.conf)
#   -> api http://api:3000 via internal network (proxied /api/, /health, /ready, /openapi.yaml, /docs)
#   -> db db:5432 via internal network (no published ports)

services:
  db:
    image: postgres:17-alpine
    container_name: warehouse-db-production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env.production (warehouse_app)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env.production (warehouse_production)}
    # No `ports:` — PostgreSQL is reachable only via the internal network.
    volumes:
      - warehouse_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - warehouse_production_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: warehouse-api-production
    environment:
      NODE_ENV: production
      PORT: 3000
      # `db` is the Compose service name; resolves only inside the network.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env.production}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN must be set in .env.production (https://warehouse.gelabs.net)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env.production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      # Loopback only. Host 3000 is used by kartar; 80/443 belong to aaPanel.
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - warehouse_production_net
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
      args:
        # Build-time only. Must be the browser-reachable origin.
        # Required — no localhost fallback in production.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set in .env.production (https://warehouse.gelabs.net)}
    container_name: warehouse-web-production
    ports:
      # Loopback only. aaPanel proxies warehouse.gelabs.net -> 127.0.0.1:5174.
      - "127.0.0.1:5174:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - warehouse_production_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

networks:
  warehouse_production_net:
    driver: bridge

volumes:
  warehouse_production_data:
    driver: local
