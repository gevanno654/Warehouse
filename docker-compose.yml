name: warehouse-receiving

services:
  db:
    image: postgres:17-alpine
    container_name: warehouse-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: warehouse-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # `db` resolves inside the Compose network only.
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app_password@db:5432/warehouse}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Required since Phase 3A: the API refuses to start without a signing key
      # it can issue and verify tokens with. Read from `.env` (see
      # `.env.example`); there is deliberately no fallback secret in this file.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env - copy .env.example}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Consumed by the browser, so it must be a host-reachable address.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    container_name: warehouse-web
    ports:
      # Host 5173 is the documented frontend port; the container listens on 80.
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
