# Production frontend Nginx.
# Used only by the `web` service in compose.production.yml.
# Development file frontend/nginx.conf is unchanged (static SPA only).
#
# Topology:
#   Browser https://warehouse.gelabs.net
#   -> aaPanel Nginx (host 80/443)
#   -> web 127.0.0.1:5174 (this file, container port 80)
#   -> api http://api:3000 (internal Compose network)
#
# The frontend bundle calls VITE_API_BASE_URL=https://warehouse.gelabs.net
# with paths /api/v1/..., so same-origin requests for /api/, /health, /ready,
# /openapi.yaml and /docs land here and are proxied to the backend with the
# full path preserved. `proxy_pass` without a URI part forwards the original
# URI unchanged; adding a trailing `/` would STRIP the `/api` prefix
# (/api/v1/products -> /v1/products) and break all backend routes.

# `api` resolves via the Compose internal network at runtime.
# Variable-only proxy_pass (no `upstream` block) avoids Nginx failing to
# start when the backend is not yet resolvable, and re-resolves per request.
# NOTE: keepalive cannot be used with variable proxy_pass; omitted deliberately.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page application: unknown paths fall back to the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Backend API — prefix preserved, e.g. /api/v1/products -> api:3000/api/v1/products.
  # No trailing slash after the variable: the full original URI is forwarded.
  location /api/ {
    set $warehouse_api_backend http://api:3000;
    proxy_pass $warehouse_api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Liveness / readiness (served at API root, not under /api/v1).
  location = /health {
    set $warehouse_api_backend http://api:3000;
    proxy_pass $warehouse_api_backend/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /ready {
    set $warehouse_api_backend http://api:3000;
    proxy_pass $warehouse_api_backend/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API contract + Swagger UI assets (served by backend).
  location = /openapi.yaml {
    set $warehouse_api_backend http://api:3000;
    proxy_pass $warehouse_api_backend/openapi.yaml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    set $warehouse_api_backend http://api:3000;
    proxy_pass $warehouse_api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Security headers appropriate for a static shell.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
}
